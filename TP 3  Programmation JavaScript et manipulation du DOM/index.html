<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Variables, conversions et boîtes de dialogue</title>
</head>
<body>
    <button type="button" onclick="demarrer()">Commencer</button><br>

    <section>
        <h2>Outils de calcul</h2>

        <label for="nombreN">Entier N (de 1 à 100) :</label>
        <input type="number" id="nombreN">

        <button type="button" id="calculerSomme">Calculer la somme</button>
        <button type="button" id="afficherPairs">Afficher les nombres pairs</button>

        <p id="resultat"></p>
    </section>
    <section id="cours">
        <h2 id="titreCours">Découvrir JavaScript</h2>

        <p class="chapitre">Les variables</p>
        <p class="chapitre important">Les fonctions</p>
        <p class="chapitre">Les événements</p>

        <button type="button" id="modifier">Modifier la présentation</button>
    </section>

    <section>
        <h2>Zone interactive</h2>
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom"
        onfocus="mettreEnEvidence(this)"
        onblur="retablirStyle(this)"
        oninput="afficherSaisie(this)">
        <p id="apercu"></p>
        <button type="button" id="selectionner">
            Sélectionner le texte
        </button>
        <p id="survol"
        onmouseover="changerCouleur(this)"
        onmouseout="retablirCouleur(this)">
        Survolez ce texte.
        </p>
    </section>

    <section>
        <h2>Formulaire et objet JavaScript</h2>
        <form id="formInscription" name="inscription">
            <p>
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom">
            </p>

            <p>
                <label for="profession">Profession :</label>
                <select id="profession" name="profession">
                    <option value="">Choisir une profession</option>
                    <option value="Technicien">Technicien</option>
                    <option value="Ingénieur">Ingénieur</option>
                    <option value="Médecin">Médecin</option>
                </select>
            </p>

            <fieldset>
                <legend>Sexe :</legend>
                <label>
                    <input type="radio" name="sexe" value="H">
                    H
                </label>
                <label>
                    <input type="radio" name="sexe" value="F">
                    F
                </label>
            </fieldset>

            <fieldset>
                <legend>Langues :</legend>
                <label>
                    <input type="checkbox" name="langue" value="Arabe">
                    Arabe
                </label>
                <label>
                    <input type="checkbox" name="langue" value="Français">
                    Français
                </label>
            </fieldset>

            <button type="submit">Inscrire</button>
            <button type="reset">Effacer</button>
            <p id="message" aria-live="polite"></p>
            <p id="recapitulatif"></p>
        </form>
    </section>

    <script src="script.js" defer></script>

</body>
</html>
